# App configurations
spring.application.name=rankly
tracker.default-daily-quota = 50

# Server Configuration
server.error.include-message=always
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.forward-headers-strategy=framework

# Flyway Configuration
spring.flyway.enable = true
spring.flyway.location = classpath:db/migration
spring.flyway.baseline-on-migrate = true
spring.flyway.baseline-versions = 1

# Postgres Configurations
spring.datasource.url =  ${DATA_SOURCE_URL:jdbc:postgresql://localhost:5432/rankly_db}
spring.datasource.username = ${DB_USER:rankly_root}
spring.datasource.password = ${DB_PASS:rankly_pass}
spring.datasource.driver-class-name = org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto = validate

# Search API configuration
searchapi.base-url = https://www.searchapi.io/api/v1/search
searchapi.api-key = ${SEARCH_API_KEY}
searchapi.connect-timeout-seconds = 10
searchapi.read-timeout-seconds = 25

# Scheduler and Cron Configurations
rankly.scheduler.cron = 0 0 6 * * *
rankly.scheduler.zone = Asia/Kolkata
rankly.alerts.significant-move-threshold = 5
